[package]
name = "miyo-rpc"
version = "0.1.0"
edition = "2021"
description = "Stellar RPC diagnostics and compatibility testing toolkit"
license = "Apache-2.0"
repository = "https://github.com/naninu123/miyo-rpc-labs"
readme = "README.md"
keywords = ["stellar", "rpc", "diagnostics", "blockchain", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[lib]
name = "miyo_rpc"
path = "src/lib.rs"

[[bin]]
name = "miyo-rpc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
chrono = { version = "0.4", features = ["std"] }
once_cell = "1.20"

[dev-dependencies]
mockito = "1.7"
tempfile = "3"

[profile.release]
lto = true
