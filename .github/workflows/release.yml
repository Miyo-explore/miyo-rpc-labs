name: Release

# Tag-triggered release pipeline. Cannot fire from a pull request or an
# ordinary branch push, so PR authors cannot publish a release.
#
# Default permissions are `contents: read` (least privilege); only the
# release job escalates to `contents: write`. The build job also needs
# `actions: write` for `actions/upload-artifact@v4`. The `dry_run` input
# (workflow_dispatch only) skips the GitHub Release step; ordinary tag
# pushes always publish.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only (skip publishing the GitHub Release)"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build & package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          # Derive version: prefer the git tag (refs/tags/v*); for manual
          # dispatches on a branch ref, fall back to Cargo.toml's version so
          # artifact names are meaningful rather than the branch name.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=$(grep '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          # `x86_64-pc-windows-msvc` does not *start* with "windows-", so match
          # anywhere in the triple instead.
          if [[ "${{ matrix.target }}" == *windows* ]]; then BIN_EXT=".exe"; else BIN_EXT=""; fi
          # With an explicit --target, cargo places the binary at
          # target/<triple>/release/ (not target/release/<triple>/).
          BIN_DIR="target/${{ matrix.target }}/release"
          BIN_PATH="${BIN_DIR}/miyo-rpc${BIN_EXT}"
          if [[ ! -f "${BIN_PATH}" ]]; then
            echo "::error::Expected binary not found: ${BIN_PATH}"
            echo "Cargo's layout with an explicit --target is target/<triple>/release/."
            echo "Contents of ${BIN_DIR}/:"
            ls -la "${BIN_DIR}/" 2>&1 || true
            exit 1
          fi
          mkdir -p dist
          # `tar` is available on all GitHub-hosted runners (incl. windows-2022's
          # bsdtar), so .tar.gz is used uniformly across platforms.
          tar -czf "dist/miyo-rpc-v${TAG}-${{ matrix.target }}.tar.gz" \
              -C "${BIN_DIR}" "miyo-rpc${BIN_EXT}"
          (cd dist && sha256sum "miyo-rpc-v${TAG}-${{ matrix.target }}.tar.gz" \
            > "miyo-rpc-v${TAG}-${{ matrix.target }}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Publish only for a real tag push, or an explicit non-dry-run dispatch on
    # a tag ref. `inputs` is empty for `push` events, so `inputs.dry_run != true`
    # is true there. A dry run skips this entire job, so it cannot create a
    # release or upload release assets.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release job needs the repo (CHANGELOG.md + scripts/) to build the
      # release notes; artifacts only carry the built binaries.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          bash scripts/extract-changelog-section.sh "$TAG" > release-notes.md
          # Fallback when CHANGELOG has no section for this tag yet
          if [ ! -s release-notes.md ]; then
            echo "v${TAG} — see the full changelog for details." > release-notes.md
          fi
          echo "release notes lines: $(wc -l < release-notes.md)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/miyo-rpc-*.tar.gz
            artifacts/miyo-rpc-*.sha256
